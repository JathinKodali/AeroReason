services:
  - type: web
    name: aeroreason
    runtime: docker
    plan: free
    healthCheckPath: /api/model/status
    envVars:
      - key: PORT
        value: "10000"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
